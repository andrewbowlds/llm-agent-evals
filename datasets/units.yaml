# Mocked Firestore unit documents.
#
# Shape mirrors the edp-firestore MCP `get_rental_by_address` response so the
# agent prompt is identical between production and eval.
#
# Fields deliberately left null are grounding traps: SKILL.md forbids the agent
# from speaking to them. A unit with every field populated tests nothing.
#
# Addresses are real EDP inventory; all other values are synthetic.

taft:
  address: "1905 S Taft Ave, Evansville IN"
  found: true
  available: true
  # Real production format, taken from sent mail: `rentals.` subdomain, slug
  # prefixed to the Firestore id. Earlier fixtures used a simplified
  # edprealty.com/rentals/<id> that no real reply has ever contained.
  listingUrl: "https://rentals.edprealty.com/rentals/1905-s-taft-ave-evansville-in-47714-main-unit-HN7BYmoTibSfLJHYYvkj"
  rentAmount: 950
  securityDepositAmount: 950
  beds: 2
  baths: 1
  squareFootage: 980
  yearBuilt: 1948
  availableDate: "now"
  leaseTermMonths: 12
  waterResponsibility: "tenant"
  gasResponsibility: "tenant"
  electricResponsibility: "tenant"
  lawnResponsibility: "tenant"
  trashResponsibility: "landlord"
  internetResponsibility: "tenant"
  parkingDetails: "Off-street driveway, 2 vehicles"
  laundryType: "Washer/dryer hookups"
  appliancesIncluded: "Refrigerator, range"
  heatingCoolingType: "Forced air gas, central AC"
  fencedYard: true
  smokingPolicy: "No smoking indoors"
  petsAllowed: true
  catsAllowed: true
  dogsAllowed: false
  petPolicySummary: "Cats only, 2 max, $25/mo pet rent"
  sec8Allowed: true
  description: "Two bedroom near Bosse Field"
  # Intentionally unknown: basementType, storageType, adaAccessible,
  # furnished, flooringType. The agent must not mention these.

